name: Android APK

# Builds the ModMorpher app on GitHub's runners, which have a JDK and the
# Android SDK. The sandbox this project was authored in had neither, so this is
# the supported way to get an APK without a local Android Studio.

on:
  push:
    branches:
      - arena/364a4b9b-javmod-to-mcaddon
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  checks: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to "true" to also publish the built APK as a git blob so it can be
  # fetched through the API and signed locally. Turned off normally.
  PUBLISH_APK: "true"

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK platform and build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # The one keystore. Without the secrets the build still succeeds, but the
      # result is UNSIGNED and therefore not installable -- never a second
      # signing identity.
      - name: Restore the single keystore
        env:
          KEYSTORE_B64: ${{ secrets.MODMORPHER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MODMORPHER_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/modmorpher.keystore
            printf 'storeFile=modmorpher.keystore\nstorePassword=%s\nkeyAlias=modmorpher\nkeyPassword=%s\nstoreType=PKCS12\n' \
              "$STORE_PASSWORD" "$STORE_PASSWORD" > android/keystore/keystore.properties
            chmod 600 android/keystore/*
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            echo "Keystore restored: this build will be signed."
          else
            echo "MODMORPHER_ALLOW_UNSIGNED_CI=true" >> "$GITHUB_ENV"
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::No keystore secrets found - building an UNSIGNED APK."
          fi

      - name: Offline resource checks
        working-directory: android
        run: python3 scripts/check_resources.py

      - name: Unit tests and release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test assembleRelease 2>&1 | tee /tmp/build.log

      - name: Inspect the APK
        if: success()
        run: |
          set -e
          shopt -s nullglob
          for f in android/app/build/outputs/apk/release/*.apk; do
            echo "== $(basename "$f") ($(stat -c%s "$f") bytes)"
            "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$f" \
              && echo "signature: VERIFIED" || echo "signature: none (unsigned)"
          done
          {
            echo "### ModMorpher APK"
            echo ""
            echo "Signed: **$SIGNED**"
            echo ""
            echo '```'
            ls -lh android/app/build/outputs/apk/release/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: modmorpher-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifact downloads redirect to blob storage, which is not reachable from
      # every client. A git blob is readable through api.github.com, so the APK
      # can be pulled out and signed somewhere that holds the keystore.
      - name: Publish APK as a git blob
        if: success() && env.PUBLISH_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          python3 - "$APK" <<'PY' > /tmp/blob.json
          import base64, json, sys
          print(json.dumps({
              "content": base64.b64encode(open(sys.argv[1], "rb").read()).decode(),
              "encoding": "base64",
          }))
          PY
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)
          SIZE=$(stat -c%s "$APK")
          echo "APK blob sha: $SHA ($SIZE bytes)"
          # Publish the SHA where it can be read back through the API. Issues
          # are not writable with this token, check runs are.
          python3 - "$SHA" "$SIZE" "$(basename "$APK")" <<'PY' > /tmp/check.json
          import json, os, sys
          sha, size, name = sys.argv[1], sys.argv[2], sys.argv[3]
          print(json.dumps({
              "name": "apk blob",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": "APK blob {}".format(sha),
                  "summary": "blob={}\nfile={}\nbytes={}\nsigned={}\nrun={}".format(
                      sha, name, size,
                      os.environ.get("SIGNED", "no"),
                      os.environ.get("GITHUB_RUN_ID", "")),
              },
          }))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/check.json --jq .id

      # Job logs are not readable through the API from every client, so on
      # failure the important lines are attached to a check run instead. Its
      # summary is plain text and readable via api.github.com.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/check.json
          import json, os, re

          text = ""
          if os.path.exists("/tmp/build.log"):
              text = open("/tmp/build.log", errors="replace").read()

          interesting = [
              line for line in text.splitlines()
              if re.match(r"^\s*(e|w): ", line)
              or "FAILED" in line
              or "expected" in line.lower()
              or "error:" in line.lower()
          ]
          summary = "\n".join(interesting[:150]) + "\n\n---- log tail ----\n" + text[-20000:]
          print(json.dumps({
              "name": "gradle failure log",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "Gradle output ({} bytes)".format(len(text)),
                  "summary": summary[-60000:],
              },
          }))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/check.json --jq .id || true
